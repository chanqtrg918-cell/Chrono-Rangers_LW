<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrono Rangers (Sentai Sandbox)</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            color: #fff;
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
        }
        #gameCanvas {
            background-color: #161e16;
            border: 4px solid #f1c40f;
            box-shadow: 0 8px 32px rgba(0,0,0,0.7);
        }
        .ui-panel {
            margin-top: 10px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            background-color: #c0392b;
            color: white;
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover { background-color: #e74c3c; }
        .cluck-btn { background-color: #d35400; }
        .cluck-btn.active { background-color: #27ae60; }
        .save-btn { background-color: #2c3e50; font-size: 0.85rem; }
        .save-btn.active { border: 2px solid #f1c40f; background-color: #34495e; }
        .freeplay-container {
            margin-top: 8px;
            background: #27ae60;
            padding: 6px 12px;
            border-radius: 4px;
            display: none;
            align-items: center;
            gap: 10px;
        }
        select {
            background: #111;
            color: #fff;
            border: 1px solid #fff;
            padding: 4px 8px;
            font-weight: bold;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div style="text-align: center; margin-bottom: 5px;">
        <h2 style="margin:0; letter-spacing: 2px; color: #f1c40f;">CHRONO RANGERS: TOTAL DEFENSE</h2>
        <div id="levelDisplay" style="font-size: 0.9rem; color: #aaa;">Campaign Level: 1 / 36</div>
        <div id="monsterIntel" style="font-size: 0.85rem; color: #e74c3c; font-weight: bold; margin-top: 2px;">Threat: Loading...</div>
    </div>

    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <div class="ui-panel">
        <button onclick="nextLevel()">Cheat: Skip Level</button>
        <button id="cluckToggle" class="cluck-btn" onclick="toggleCluckProtocol()">Cluck Protocol: OFF</button>
    </div>

    <div id="freeplayPanel" class="freeplay-container">
        <span style="font-weight: bold; font-size: 0.85rem;">🏆 FREEPLAY UNLOCKED:</span>
        <select id="freeplaySelect" onchange="selectFreeplayLevel(this.value)">
            <!-- Populated via script -->
        </select>
    </div>

    <div class="ui-panel" style="margin-top: 5px; background: #222; padding: 8px; border-radius: 6px;">
        <span style="font-size: 0.85rem; color: #aaa;">Save Profile:</span>
        <button id="save1" class="save-btn" onclick="selectSaveSlot(1)">Slot 1</button>
        <button id="save2" class="save-btn" onclick="selectSaveSlot(2)">Slot 2</button>
        <button id="save3" class="save-btn" onclick="selectSaveSlot(3)">Slot 3</button>
    </div>

<script>
/**
 * CHRONO RANGERS - Tactical Sentai Engine Core
 * Architecture: 100% Self-Contained Vector Pipeline. Zero External Dependencies.
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Global Engine Control
let currentLevel = 1;
let currentSlot = 1;
let gamePhase = "SQUAD_INIT"; 
let cluckProtocolActive = false;
let transitionFreeze = 0; 
let isGameCleared = false;

// Entities Pools
let rangers = [];
let enemies = [];
let projectiles = [];
let bossUnit = null;

const RANGER_COLORS = ['#e74c3c', '#3498db', '#2ecc71', '#f1c40f', '#9b59b6', '#e67e22', '#1abc9c', '#e84393', '#fdcb6e', '#6c5ce7'];

const MONSTER_ARCHETYPES = [
    { name: "Krybot Commander", color: "#7f8c8d" },
    { name: "Lava Construct", color: "#d35400" },
    { name: "Glacial Golem", color: "#3498db" },
    { name: "Sinister Alien Fugitive", color: "#27ae60" }
];

// Populate Freeplay Selector Options
const selectEl = document.getElementById('freeplaySelect');
for(let i = 1; i <= 36; i++) {
    let opt = document.createElement('option');
    opt.value = i;
    opt.innerText = `Level ${i}`;
    selectEl.appendChild(opt);
}

function loadProgress() {
    const savedLevel = localStorage.getItem(`chrono_save_slot_${currentSlot}`);
    currentLevel = savedLevel ? parseInt(savedLevel, 10) : 1;
    
    const clearedState = localStorage.getItem(`chrono_slot_cleared_${currentSlot}`);
    isGameCleared = clearedState === "true";
    
    document.getElementById('freeplayPanel').style.display = isGameCleared ? "flex" : "none";
    if (isGameCleared) {
        document.getElementById('freeplaySelect').value = currentLevel;
    }
    
    updateSlotUI();
}

function saveProgress() {
    localStorage.setItem(`chrono_save_slot_${currentSlot}`, currentLevel);
    if (isGameCleared) {
        localStorage.setItem(`chrono_slot_cleared_${currentSlot}`, "true");
    }
    updateSlotUI();
}

function selectSaveSlot(slotNum) {
    currentSlot = slotNum;
    loadProgress();
    initLevel();
}

function selectFreeplayLevel(lvl) {
    currentLevel = parseInt(lvl, 10);
    saveProgress();
    initLevel();
}

function updateSlotUI() {
    for (let i = 1; i <= 3; i++) {
        const btn = document.getElementById(`save${i}`);
        const slotVal = localStorage.getItem(`chrono_save_slot_${i}`) || 1;
        const slotClear = localStorage.getItem(`chrono_slot_cleared_${i}`) === "true";
        btn.innerText = `Slot ${i} (Lvl ${slotVal})${slotClear ? ' 🏆' : ''}`;
        if (i === currentSlot) {
            btn.classList.add('active');
        } else {
            btn.classList.remove('active');
        }
    }
}

function initLevel() {
    // Lock engine phase immediately to prevent early game-over or next-level checks
    gamePhase = "SQUAD_INIT";
    transitionFreeze = 45; 
    
    rangers = [];
    enemies = [];
    projectiles = [];
    bossUnit = null;
    
    document.getElementById('levelDisplay').innerText = `Campaign Level: ${currentLevel} / 36`;
    if (isGameCleared) {
        document.getElementById('freeplaySelect').value = currentLevel;
    }

    let activeSquadSize = currentLevel >= 25 ? 10 : (currentLevel >= 12 ? 8 : 5);
    for (let i = 0; i < activeSquadSize; i++) {
        rangers.push({
            id: i,
            x: 60 + (i * 20),
            y: 120 + (i * 28),
            color: RANGER_COLORS[i],
            hp: 120,
            maxHp: 120,
            size: 10,
            weaponMode: i % 2 === 0 ? "SWORD_SHIELD" : "MORPH_BLASTER",
            shieldUp: false,
            specialCooldown: 100 + Math.random() * 200,
            specialActiveTimer: 0
        });
    }

    let enemyCount = 6 + currentLevel;
    for (let i = 0; i < enemyCount; i++) {
        enemies.push({
            x: 450 + Math.random() * 300,
            y: 40 + Math.random() * 360,
            hp: 45,
            isChicken: cluckProtocolActive,
            shootTimer: 60 + Math.random() * 120,
            eggTimer: Math.random() * 100
        });
    }

    if (currentLevel === 35) {
        bossUnit = {
            name: "A-SQUAD ROGUE MEGAZORD",
            color: "#2c3e50",
            borderColor: "#e74c3c", 
            size: 50,
            hp: 2500,
            maxHp: 2500,
            isASquad: true,
            isFinal: false,
            x: 600,
            y: 120
        };
        document.getElementById('monsterIntel').innerText = `JUDGEMENT TIME: ${bossUnit.name} (Rogue Elite Core Detected)`;
    } else if (currentLevel === 36) {
        bossUnit = {
            name: "OMNI-CROWN PREMIER",
            color: "#000000",
            borderColor: "#9b59b6",
            size: 65,
            hp: 4000,
            maxHp: 4000,
            isASquad: false,
            isFinal: true,
            x: 600,
            y: 120
        };
        document.getElementById('monsterIntel').innerText = `CRITICAL THREAT: ${bossUnit.name} (Ancient Cybernetic God Form)`;
    } else {
        let arch = MONSTER_ARCHETYPES[currentLevel % MONSTER_ARCHETYPES.length];
        bossUnit = {
            name: `${arch.name} v.${currentLevel}`,
            color: arch.color,
            borderColor: "#c0392b",
            size: 32 + (currentLevel * 0.5),
            hp: 250 + (currentLevel * 60),
            maxHp: 250 + (currentLevel * 60),
            isASquad: false,
            isFinal: false,
            x: 600,
            y: 120
        };
        document.getElementById('monsterIntel').innerText = `Target: ${bossUnit.name}`;
    }
}

function toggleCluckProtocol() {
    cluckProtocolActive = !cluckProtocolActive;
    const btn = document.getElementById('cluckToggle');
    btn.innerText = cluckProtocolActive ? "Cluck Protocol: ON 🐔" : "Cluck Protocol: OFF";
    btn.className = cluckProtocolActive ? "cluck-btn active" : "cluck-btn";
    initLevel();
}

function nextLevel() {
    if (currentLevel === 36) {
        isGameCleared = true;
        document.getElementById('freeplayPanel').style.display = "flex";
        saveProgress();
        initLevel();
    } else {
        currentLevel++;
        saveProgress();
        initLevel();
    }
}

function update() {
    // If we are freezing or configuring structures, break immediately to block race conditions
    if (transitionFreeze > 0) {
        transitionFreeze--;
        if (transitionFreeze === 0 && gamePhase === "SQUAD_INIT") {
            gamePhase = "SQUAD_BRAWL"; // Hand off control to the brawl safely AFTER the freeze completely clears
        }
        return;
    }

    if (gamePhase === "SQUAD_BRAWL") {
        // Safe check: Only go to megazord duel if enemies are genuinely wiped out post-freeze
        if (enemies.length === 0 && rangers.length > 0) {
            gamePhase = "MEGAZORD_DUEL";
            projectiles = [];
            return;
        }

        enemies.forEach(e => {
            if (rangers.length > 0) {
                let target = rangers[Math.floor(Math.random() * rangers.length)];
                let dx = target.x - e.x;
                let dy = target.y - e.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                
                if (dist > 150) {
                    e.x += (dx / dist) * 0.9;
                    e.y += (dy / dist) * 0.9;
                }

                if (e.isChicken) {
                    e.eggTimer--;
                    if (e.eggTimer <= 0) {
                        projectiles.push({ x: e.x, y: e.y, type: 'EGG', vx: -2.5, vy: (Math.random() - 0.5) * 2 });
                        e.eggTimer = 100 + Math.random() * 80;
                    }
                } else {
                    e.shootTimer--;
                    if (e.shootTimer <= 0) {
                        projectiles.push({ x: e.x, y: e.y, type: 'GOON_BLAST', vx: -3.5, vy: (target.y - e.y) / (dist || 1) * 2 });
                        e.shootTimer = 140 + Math.random() * 100;
                    }
                }
            }
        });

        rangers.forEach(r => {
            if (enemies.length > 0) {
                let target = enemies[0];
                let dx = target.x - r.x;
                let dy = target.y - r.y;
                let dist = Math.sqrt(dx*dx + dy*dy);

                if (r.specialCooldown > 0) r.specialCooldown--;

                if (r.weaponMode === "SWORD_SHIELD") {
                    if (r.specialCooldown <= 0 && dist < 120 && dist > 30) {
                        r.specialCooldown = 300 + Math.random() * 150;
                        r.specialActiveTimer = 15; 
                        r.x += (dx / dist) * 60; 
                        r.y += (dy / dist) * 60;
                        enemies.slice(0, 3).forEach(en => en.hp -= 25); 
                    }

                    if (r.specialActiveTimer > 0) {
                        r.specialActiveTimer--;
                    }

                    if (dist > 25) {
                        r.x += (dx / dist) * 2.0;
                        r.y += (dy / dist) * 2.0;
                        r.shieldUp = false;
                    } else {
                        target.hp -= 0.6;
                        r.shieldUp = true;
                    }
                } else if (r.weaponMode === "MORPH_BLASTER") {
                    if (dist < 180) {
                        r.x -= (dx / dist) * 1.0;
                    }

                    if (r.specialCooldown <= 0 && Math.random() < 0.05) {
                        r.specialCooldown = 250 + Math.random() * 200;
                        projectiles.push({ x: r.x, y: r.y, type: 'DELTA_BURST', vx: 7, vy: (target.y - r.y) / (dist || 1) * 2.5, color: '#f39c12' });
                    }

                    if (Math.random() < 0.03) {
                        projectiles.push({ x: r.x, y: r.y, type: 'RANGER_LASER', vx: 6, vy: (target.y - r.y) / (dist || 1) * 2, color: r.color });
                    }
                }
            }
        });

        for (let i = projectiles.length - 1; i >= 0; i--) {
            let p = projectiles[i];
            p.x += p.vx;
            p.y += p.vy;

            if (p.x < 0 || p.x > canvas.width || p.y < 0 || p.y > canvas.height) {
                projectiles.splice(i, 1);
                continue;
            }

            if (p.type === 'RANGER_LASER') {
                for (let j = enemies.length - 1; j >= 0; j--) {
                    let e = enemies[j];
                    if (Math.abs(p.x - e.x) < 14 && Math.abs(p.y - e.y) < 14) {
                        e.hp -= 12;
                        projectiles.splice(i, 1);
                        if (e.hp <= 0) enemies.splice(j, 1);
                        break;
                    }
                }
            } else if (p.type === 'DELTA_BURST') {
                for (let j = enemies.length - 1; j >= 0; j--) {
                    let e = enemies[j];
                    if (Math.abs(p.x - e.x) < 35 && Math.abs(p.y - e.y) < 35) {
                        e.hp -= 35;
                        if (e.hp <= 0) enemies.splice(j, 1);
                    }
                }
                projectiles.splice(i, 1);
            } else if (p.type === 'GOON_BLAST' || p.type === 'EGG') {
                for (let k = rangers.length - 1; k >= 0; k--) {
                    let r = rangers[k];
                    if (Math.abs(p.x - r.x) < 12 && Math.abs(p.y - r.y) < 12) {
                        let damage = p.type === 'EGG' ? 8 : 15;
                        if (r.shieldUp) damage *= 0.2; 
                        r.hp -= damage;
                        projectiles.splice(i, 1);
                        if (r.hp <= 0) rangers.splice(k, 1);
                        break;
                    }
                }
            }
        }

        if (rangers.length === 0) {
            initLevel(); 
        }
    } else if (gamePhase === "MEGAZORD_DUEL") {
        if (!bossUnit) return; 

        if (Math.random() < 0.18) {
            projectiles.push({ x: 195, y: 194, type: 'SWAT_LASER', vx: 9, vy: (Math.random() - 0.5) * 2, color: '#06b6d4' });
            projectiles.push({ x: 195, y: 234, type: 'SWAT_LASER', vx: 9, vy: (Math.random() - 0.5) * 2, color: '#06b6d4' });
        }

        if (bossUnit.isASquad && Math.random() < 0.09) {
            projectiles.push({ x: bossUnit.x - 25, y: bossUnit.y + 57, type: 'ASQUAD_LASER', vx: -7.5, vy: (Math.random() - 0.5) * 3, color: '#e74c3c' });
        }

        for (let i = projectiles.length - 1; i >= 0; i--) {
            let p = projectiles[i];
            p.x += p.vx;
            p.y += p.vy;

            if (p.x < 0 || p.x > canvas.width) {
                projectiles.splice(i, 1);
                continue;
            }

            if (p.type === 'SWAT_LASER') {
                let hitWidth = bossUnit.isASquad ? 80 : (bossUnit.isFinal ? bossUnit.size * 2.5 : bossUnit.size * 1.5);
                let hitHeight = bossUnit.isASquad ? 150 : (bossUnit.isFinal ? bossUnit.size * 3.5 : bossUnit.size * 2);
                if (p.x >= bossUnit.x && p.x <= bossUnit.x + hitWidth && p.y >= bossUnit.y && p.y <= bossUnit.y + hitHeight) {
                    bossUnit.hp -= 25;
                    projectiles.splice(i, 1);
                }
            }
            
            if (p.type === 'ASQUAD_LASER') {
                if (p.x <= 180 && p.x >= 100 && p.y >= 140 && p.y <= 290) {
                    projectiles.splice(i, 1); 
                }
            }
        }

        if (bossUnit.hp <= 0) {
            nextLevel();
        }
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (gamePhase === "SQUAD_INIT" || transitionFreeze > 0) {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 18px monospace';
        ctx.fillText("SYNCHRONIZING REVOLUTION MATRIX...", 230, 220);
        return;
    }

    if (gamePhase === "SQUAD_BRAWL") {
        rangers.forEach(r => {
            ctx.save();
            ctx.fillStyle = r.color;
            ctx.beginPath();
            ctx.arc(r.x, r.y, r.size, 0, Math.PI * 2);
            ctx.fill();

            if (r.specialActiveTimer > 0) {
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 3;
                ctx.stroke();
            }

            if (r.weaponMode === "SWORD_SHIELD") {
                ctx.strokeStyle = '#f1c40f'; 
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(r.x, r.y);
                ctx.lineTo(r.x + 8, r.y - 6);
                ctx.stroke();

                if (r.shieldUp) {
                    ctx.fillStyle = 'rgba(52, 152, 219, 0.6)'; 
                    ctx.beginPath();
                    ctx.arc(r.x + 6, r.y, 7, -Math.PI/2, Math.PI/2);
                    ctx.fill();
                }
            } else {
                ctx.fillStyle = '#fff'; 
                ctx.fillRect(r.x + 4, r.y - 2, 5, 3);
            }
            ctx.restore();
        });

        enemies.forEach(e => {
            ctx.save();
            if (e.isChicken) {
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(e.x, e.y, 9, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = '#e67e22'; 
                ctx.fillRect(e.x - 11, e.y - 3, 3, 3);
            } else {
                ctx.fillStyle = '#34495e';
                ctx.fillRect(e.x - 8, e.y - 8, 16, 16);
                ctx.fillStyle = '#c0392b'; 
                ctx.fillRect(e.x - 6, e.y - 4, 10, 2);
            }
            ctx.restore();
        });

        projectiles.forEach(p => {
            ctx.save();
            if (p.type === 'DELTA_BURST') {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.fillStyle = p.type === 'EGG' ? '#f1c40f' : (p.type === 'GOON_BLAST' ? '#e74c3c' : p.color);
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.type === 'EGG' ? 4 : 3, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        });

    } else if (gamePhase === "MEGAZORD_DUEL") {
        if (!bossUnit) return;

        ctx.save();
        // --- ALLIES: S.P.D. SWAT MEGAZORD HOVER CHASSIS ---
        ctx.fillStyle = '#1f2937';
        ctx.fillRect(60, 160, 45, 70);  
        ctx.fillRect(175, 160, 45, 70); 

        ctx.fillStyle = '#111827'; 
        ctx.fillRect(100, 140, 80, 150); 
        ctx.fillStyle = '#1e40af'; 
        ctx.fillRect(115, 160, 50, 55);

        ctx.fillStyle = '#4b5563';
        ctx.fillRect(125, 110, 30, 30);
        ctx.fillStyle = '#06b6d4'; 
        ctx.fillRect(128, 120, 24, 5);

        // SHOW-ACCURATE DUAL TWIN CANNONS
        ctx.fillStyle = '#374151';
        ctx.fillRect(160, 190, 35, 14);  
        ctx.fillRect(160, 230, 35, 14);  
        ctx.fillStyle = '#06b6d4';
        ctx.fillRect(190, 194, 6, 6);
        ctx.fillRect(190, 234, 6, 6);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 15px monospace';
        ctx.fillText("S.W.A.T. DUAL STRIKER PROTOCOL", 50, 85);

        // --- ADVERSARIES RENDERING ARRAY ---
        if (bossUnit.isFinal) {
            ctx.fillStyle = '#4c1d95';
            ctx.fillRect(bossUnit.x - 20, bossUnit.y - 30, bossUnit.size * 2.5, bossUnit.size * 3.5);
            ctx.fillStyle = bossUnit.color; 
            ctx.beginPath();
            ctx.arc(bossUnit.x + 45, bossUnit.y + 60, 40, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#f1c40f';
            for (let angle = 0; angle < Math.PI * 2; angle += Math.PI / 4) {
                let bx = bossUnit.x + 45 + Math.cos(angle) * 55;
                let by = bossUnit.y + 60 + Math.sin(angle) * 55;
                ctx.fillRect(bx - 6, by - 6, 12, 12);
            }
        } else if (bossUnit.isASquad) {
            ctx.fillStyle = '#2c3e50'; 
            ctx.fillRect(bossUnit.x, bossUnit.y, 80, 150);
            ctx.fillStyle = '#1a252f'; 
            ctx.fillRect(bossUnit.x + 15, bossUnit.y + 20, 50, 55);
            
            ctx.fillStyle = '#7f8c8d';
            ctx.fillRect(bossUnit.x + 25, bossUnit.y - 30, 30, 30);
            ctx.fillStyle = '#e74c3c'; 
            ctx.fillRect(bossUnit.x + 28, bossUnit.y - 20, 24, 5);

            ctx.fillStyle = '#34495e';
            ctx.fillRect(bossUnit.x - 20, bossUnit.y + 50, 25, 15);
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(bossUnit.x - 25, bossUnit.y + 55, 5, 5);
        } else {
            ctx.fillStyle = bossUnit.color;
            ctx.strokeStyle = bossUnit.borderColor;
            ctx.lineWidth = 4;
            ctx.fillRect(bossUnit.x, bossUnit.y, bossUnit.size * 1.5, bossUnit.size * 2);
            ctx.strokeRect(bossUnit.x, bossUnit.y, bossUnit.size * 1.5, bossUnit.size * 2);
        }

        // Projectiles Loop
        projectiles.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, 14, 3);
        });

        // Duel Interface Health Bar
        ctx.fillStyle = '#7f1d1d';
        ctx.fillRect(220, 30, 360, 16);
        ctx.fillStyle = '#22c55e';
        let healthRatio = Math.max(0, bossUnit.hp / bossUnit.maxHp);
        ctx.fillRect(220, 30, 360 * healthRatio, 16);
        ctx.restore();
    }
}

function runLoop() {
    update();
    draw();
    requestAnimationFrame(runLoop);
}

// Spark up system operations cleanly
loadProgress();
initLevel();
runLoop();
</script>
</body>
</html>
